name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  verify:
    uses: ./.github/workflows/checks.yml
  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/package.py
      - name: Publish archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
